# Copy to .github/workflows/backup.yml in a PRIVATE repository.
# Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under Settings > Secrets and variables > Actions.
name: Supabase table backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes github:ansab-imam/supabase-table-backup export --all --out ./backups --format json

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/
          retention-days: 14
          if-no-files-found: error
